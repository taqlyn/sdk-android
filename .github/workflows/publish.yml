name: Publish Android SDK (Maven Central)

# Phase 1 native core. Publish this before RN, Flutter, and Compose nav adapters.
# Deploys signed AARs to Maven Central via Sonatype Central Portal API.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish Android SDK
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Restore GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is required for Maven Central."
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | base64 -d > "${GITHUB_WORKSPACE}/signing.gpg"

      - name: Publish to Maven Central
        env:
          SIGNING_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: |
          ./gradlew :taqlyn-sdk:publishAndReleaseToMavenCentral \
            -Psigning.keyId="$SIGNING_KEY_ID" \
            -Psigning.password="$SIGNING_PASSWORD" \
            -Psigning.secretKeyRingFile="${GITHUB_WORKSPACE}/signing.gpg" \
            -PsonatypeUsername="$SONATYPE_USERNAME" \
            -PsonatypePassword="$SONATYPE_PASSWORD"
