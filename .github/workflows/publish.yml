name: Publish Android SDK (Maven Central)

# Phase 1 native core. Publish this before RN, Flutter, and Compose nav adapters.
# Deploys signed AARs to Maven Central via Sonatype Central Portal API.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish Android SDK
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Publish to Maven Central
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is required for Maven Central."
            exit 1
          fi
          key_file="${RUNNER_TEMP}/signing-key.asc"
          if printf '%s' "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP"; then
            printf '%s\n' "$GPG_PRIVATE_KEY" > "$key_file"
          else
            printf '%s' "$GPG_PRIVATE_KEY" | base64 -d > "$key_file"
          fi
          if [ ! -s "$key_file" ]; then
            echo "::error::Failed to decode GPG_PRIVATE_KEY into an ASCII-armored PGP key."
            exit 1
          fi
          # Command substitution strips trailing newlines; armor parsing needs one.
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(cat "$key_file"; printf x)"
          export ORG_GRADLE_PROJECT_signingInMemoryKey="${ORG_GRADLE_PROJECT_signingInMemoryKey%x}"
          key_id="${GPG_KEY_ID#0x}"
          key_id="${key_id#0X}"
          if [ "${#key_id}" -ge 8 ]; then
            export ORG_GRADLE_PROJECT_signingInMemoryKeyId="${key_id: -8}"
          fi
          ./gradlew :taqlyn-sdk:publishAndReleaseToMavenCentral --stacktrace
